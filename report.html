<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingestion Report</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; padding: 24px; line-height: 1.5; background: #f7f7f8; color: #1a1a1a; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: #6b7280; margin: 0 0 20px; }
  .controls { background:#fff; border:1px solid #e2e2e6; border-radius:10px;
              padding:16px; margin-bottom:20px; }
  label.filebtn { display:inline-block; font-size:1rem; padding:10px 16px; border-radius:8px;
    border:1px solid #0a66ff; background:#0a66ff; color:#fff; cursor:pointer; }
  input[type=file] { display:none; }
  #status { margin-left:12px; color:#6b7280; }
  .run { background:#fff; border:1px solid #e2e2e6; border-radius:10px;
         padding:16px 18px; margin-bottom:16px; }
  .run h2 { font-size:1.1rem; margin:0 0 2px; }
  .run h3 { font-size:.95rem; margin:16px 0 6px; }
  td code { white-space:nowrap; }
  .run table { display:block; overflow-x:auto; }
  .when { color:#6b7280; font-size:.9rem; margin:0 0 12px; }
  .counts { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip { padding:4px 10px; border-radius:999px; font-size:.85rem;
          background:#eef1f6; border:1px solid #dde1e8; }
  .chip b { font-weight:700; }
  table { border-collapse:collapse; width:100%; font-size:.88rem; }
  th, td { border:1px solid #e2e2e6; padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:#f0f1f4; }
  .reason { color:#9a6700; }
  .empty { color:#6b7280; font-style:italic; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; word-break:break-all; }
  @media (prefers-color-scheme: dark) {
    body { background:#16181d; color:#e7e9ee; }
    .run, .controls { background:#1f232b; border-color:#333a45; }
    th { background:#272c35; }
    th, td { border-color:#333a45; }
    .chip { background:#272c35; border-color:#333a45; }
    .reason { color:#f0c674; }
    .sub, .when, #status, .empty { color:#9aa3b2; }
  }
</style>
</head>
<body>
  <h1>Ingestion Report</h1>
  <p class="sub">Open <code>ingestion-log.json</code> to see each run, newest first.</p>

  <div class="controls">
    <label class="filebtn">Open ingestion-log.json
      <input type="file" id="file" accept="application/json,.json">
    </label>
    <span id="status"></span>
  </div>

  <div id="runs"></div>

<script>
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  document.getElementById("file").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        render(JSON.parse(r.result));
        document.getElementById("status").textContent = "Loaded " + f.name;
      } catch (err) {
        document.getElementById("status").textContent = "Could not parse JSON: " + err.message;
      }
    };
    r.readAsText(f);
  });

  function render(log) {
    if (!Array.isArray(log)) log = [log];
    const host = document.getElementById("runs");
    host.innerHTML = "";
    if (log.length === 0) {
      host.innerHTML = '<p class="empty">No runs in the log yet.</p>';
      return;
    }
    for (let i = log.length - 1; i >= 0; i--) {     // newest first
      host.appendChild(runEl(log[i], i + 1));
    }
  }

  function chip(label, v) {
    return '<span class="chip">' + label + " <b>" + (v == null ? 0 : v) + "</b></span>";
  }

  function table(cols, rows, cells) {
    if (!rows || rows.length === 0) return '<p class="empty">None.</p>';
    return '<table><thead><tr>' + cols.map(c => '<th>' + c + '</th>').join("")
      + '</tr></thead><tbody>'
      + rows.map(r => '<tr>' + cells(r).map(c => '<td>' + c + '</td>').join("") + '</tr>').join("")
      + '</tbody></table>';
  }

  function runEl(run, n) {
    const warnings = run.warnings || [];
    const repairs = warnings.filter(w => w.after != null && w.after !== "");
    const unfixable = warnings.filter(w => w.after == null || w.after === "");
    const t = run.database_totals || {};
    const div = document.createElement("div");
    div.className = "run";
    div.innerHTML =
      "<h2>Run " + n + " — " + esc(run.source_file) + "</h2>"
      + '<p class="when">' + esc(run.run_at) + "</p>"
      + '<div class="counts">'
      + chip("rows read", run.rows_read) + chip("loaded", run.loaded)
      + chip("updated", run.updated) + chip("skipped", run.skipped)
      + chip("rejected", run.rejected) + "</div>"
      + "<h3>Rejected rows</h3>"
      + table(["book_id", "title", "isbn", "isbn13", "reason"], run.rejected_rows, x => [
          esc(x.book_id), esc(x.title), "<code>" + esc(x.isbn) + "</code>",
          "<code>" + esc(x.isbn13) + "</code>", '<span class="reason">' + esc(x.reason) + "</span>"])
      + "<h3>Repairs (before → after)</h3>"
      + table(["book_id", "title", "field", "before → after", "reason"], repairs, w => [
          esc(w.book_id), esc(w.title), esc(w.field),
          "<code>" + esc(w.before) + "</code> → <code>" + esc(w.after) + "</code>", esc(w.reason)])
      + "<h3>Warnings (ISBN not usable, stored as NULL)</h3>"
      + table(["book_id", "title", "field", "value", "reason"], unfixable, w => [
          esc(w.book_id), esc(w.title), esc(w.field), "<code>" + esc(w.before) + "</code>",
          '<span class="reason">' + esc(w.reason) + "</span>"])
      + "<h3>Updated rows</h3>"
      + table(["book_id", "title", "changed columns"], run.updated_rows, u => [
          esc(u.book_id), esc(u.title), esc((u.changed_columns || []).join(", "))])
      + "<h3>Database totals after this run</h3>"
      + '<div class="counts">' + chip("books", t.total_books)
      + chip("with an ISBN-13", t.books_with_isbn13)
      + chip("without any ISBN", t.books_without_isbn) + "</div>";
    return div;
  }
</script>
</body>
</html>
